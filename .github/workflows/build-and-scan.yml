name: Build, Test & Security Checks

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main, staging]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true # Report only; dependency upgrades are reviewed separately

      - name: Check for committed env files
        run: |
          tracked_env="$(git ls-files '.env*' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "ERROR: environment files must not be committed:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Scan for hardcoded secrets
        run: |
          if grep -rInE "(NEXTAUTH_SECRET|PRIVATE_KEY|API_SECRET|SECRET_KEY)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" src scripts 2>/dev/null; then
            echo "ERROR: a possible hardcoded secret was found."
            exit 1
          fi

      - name: Block eval usage
        run: |
          if grep -rInE '\beval[[:space:]]*\(' src; then
            echo "ERROR: eval() is not allowed."
            exit 1
          fi

      - name: Verify HTML injection is sanitized
        run: |
          files="$(grep -rl 'dangerouslySetInnerHTML' src || true)"
          for file in $files; do
            if ! grep -qE '(DOMPurify|sanitize|sanitizeHtml)' "$file"; then
              echo "ERROR: $file uses dangerouslySetInnerHTML without sanitizing the HTML."
              exit 1
            fi
          done

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:run

      - name: Build Next.js app
        run: npx next build
